name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pospay_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d pospay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSPAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pospay_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run tsc --noEmit
      - name: Apply migrations and verify database isolation
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          run_sql() {
            docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d pospay_test -v ON_ERROR_STOP=1
          }

          run_sql <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL
          for migration in db/migrations/*.sql; do
            run_sql < "$migration"
          done
          for test_file in db/tests/*.sql; do
            run_sql < "$test_file"
          done
      - run: bun run test
      - run: bun run build
        env:
          NITRO_PRESET: node-server
